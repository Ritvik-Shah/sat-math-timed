name = "sat-math-tutor"
main = "src/index.js"
compatibility_date = "2026-08-01"
# (CI auto-deploy test — see .github/workflows/deploy-worker.yml)

[vars]
# Ollama Cloud model to use. "-cloud" suffix runs on Ollama's hosted infrastructure
# (no local GPU needed) and is billed against your Ollama account.
# 20b loads faster on a cold start than 120b (less weight data to move onto
# the GPU) at some cost to reasoning quality. Swap back to "gpt-oss:120b-cloud"
# if you want the stronger model and can live with longer cold starts.
OLLAMA_MODEL = "gpt-oss:20b-cloud"

# Comma-separated list of origins allowed to call this worker. Add your local
# dev server origin(s) here too (e.g. http://localhost:8811) while testing.
ALLOWED_ORIGINS = "https://ritvik-shah.github.io,http://localhost:8811"

# OLLAMA_API_KEY is set separately as a secret (never goes in this file):
#   wrangler secret put OLLAMA_API_KEY

# Supabase project URL and anon (public) key, used to verify the bearer
# token a logged-in user sends with /tutor requests (mode != "warmup").
# Both are safe to keep in plain vars — the anon key is meant to be public,
# it can't read/write anything RLS doesn't allow.
SUPABASE_URL = "https://khooprfrdazbhsxeasyn.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_Uz-FEWXsX4BCaAVxbFgEnA_ktmWCjYb"

# Monthly per-account cap on AI Tutor requests (explain/chat/summary
# combined), enforced via the tutor_usage table. 300/month is a conservative
# starting guess with no real usage data behind it yet — revisit once you
# can see actual per-user request volume.
TUTOR_MONTHLY_QUOTA = "300"

# SUPABASE_SERVICE_ROLE_KEY is set separately as a secret (never goes in this
# file) — it's used server-side only, to read/write subscriptions and
# tutor_usage without being subject to RLS:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60
